      summary: Get current Simulation Timeline state
      operationId: getSimulationState
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySimulationStateResponse"

  /story-ticks/{tick_id}/events:
    get:
      tags: [StoryTicks]
      summary: List Simulation Timeline tick-run events
      description: Backward-compatible story path. The tick_id path parameter identifies a simulation tick run, not a Narrative Timeline tick. Prefer /simulation-tick-runs/{tick_run_id}/events in new clients.
      operationId: listStoryTickEvents
      parameters:
        - $ref: "#/components/parameters/TickId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationEventListResponse"

  /simulation-tick-runs/{tick_run_id}/events:
    get:
      tags: [SimulationTimeline]
      summary: List Simulation Timeline tick-run events
      operationId: listSimulationTickRunEvents
      parameters:
        - $ref: "#/components/parameters/TickRunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationEventListResponse"

  /story-ticks/{tick_id}/snapshot:
    get:
      tags: [StoryTicks]
      summary: Get Simulation Timeline tick-run snapshot
      description: Backward-compatible story path. The tick_id path parameter identifies a simulation tick run, not a Narrative Timeline tick. Prefer /simulation-tick-runs/{tick_run_id}/snapshot in new clients.
      operationId: getStoryTickSnapshot
      parameters:
        - $ref: "#/components/parameters/TickId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationSnapshotResponse"

  /simulation-tick-runs/{tick_run_id}/snapshot:
    get:
      tags: [SimulationTimeline]
      summary: Get Simulation Timeline tick-run snapshot
      operationId: getSimulationTickRunSnapshot
      parameters:
        - $ref: "#/components/parameters/TickRunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationSnapshotResponse"

  /projects/{project_id}/chapters:
    get:
      tags: [Chapters]
      summary: List committed chapters
      operationId: listChapters
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterListResponse"

  /chapters/{chapter_id}:
    get:
      tags: [Chapters]
      summary: Get committed chapter
      operationId: getChapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterResponse"

  /characters/{character_id}/memories:
    get:
      tags: [Memories]
      summary: List character memories
      operationId: listCharacterMemories
      parameters:
        - $ref: "#/components/parameters/CharacterId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
    post:
      tags: [Memories]
      summary: Create character memory
      operationId: createCharacterMemory
      parameters:
        - $ref: "#/components/parameters/CharacterId"
