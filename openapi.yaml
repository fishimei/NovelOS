      tags: [StorySessions]
      summary: Create story session
      operationId: createStorySession
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorySessionRequest"
