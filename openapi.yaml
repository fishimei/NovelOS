          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /narrative-branches/{branch_id}/advance:
    post:
      tags: [NarrativeTimeline]
      summary: Advance Narrative Timeline from a branch head
      operationId: advanceNarrativeBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStorySessionRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /story-ticks/{tick_id}:
    get:
      tags: [StoryTimeline]
      summary: Get Narrative Timeline tick
      description: Backward-compatible story path for a Narrative Timeline tick. Prefer /narrative-ticks/{tick_id} in new clients.
      operationId: getStoryTick
      parameters:
        - $ref: "#/components/parameters/TickId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryTickResponse"

  /narrative-ticks/{tick_id}:
    get:
      tags: [NarrativeTimeline]
      summary: Get Narrative Timeline tick
      operationId: getNarrativeTick
      parameters:
        - $ref: "#/components/parameters/TickId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryTickResponse"

  /story-ticks/{tick_id}/state:
    get:
      tags: [StoryTimeline]
      summary: Resolve Narrative Timeline tick state
      description: Backward-compatible story path. Resolves state refs by walking the parent narrative tick chain and reusing unchanged entity versions.
      operationId: getStoryTickState
      parameters:
        - $ref: "#/components/parameters/TickId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryTickStateResponse"

  /narrative-ticks/{tick_id}/state:
    get:
      tags: [NarrativeTimeline]
      summary: Resolve Narrative Timeline tick state
      description: Resolves state refs by walking the parent narrative tick chain and reusing unchanged entity versions.
      operationId: getNarrativeTickState
      parameters:
        - $ref: "#/components/parameters/TickId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryTickStateResponse"

  /story-ticks/{tick_id}/fork:
    post:
      tags: [StoryTimeline]
      summary: Fork a Narrative Timeline branch from a tick
      description: Backward-compatible story path for a Narrative Timeline fork. Prefer /narrative-ticks/{tick_id}/fork in new clients.
      operationId: forkStoryTick
      parameters:
        - $ref: "#/components/parameters/TickId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkStoryTickRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryBranchResponse"

  /narrative-ticks/{tick_id}/fork:
    post:
      tags: [NarrativeTimeline]
      summary: Fork a Narrative Timeline branch from a tick
      operationId: forkNarrativeTick
      parameters:
        - $ref: "#/components/parameters/TickId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkStoryTickRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryBranchResponse"

  /story-runs/{run_id}:
    get:
      tags: [StoryRuns]
      summary: Get story run
      operationId: getStoryRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /story-runs/{run_id}/result:
    get:
      tags: [StoryRuns]
      summary: Get story run result
      operationId: getStoryRunResult
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResultResponse"

  /story-runs/{run_id}/events:
    get:
      tags: [StoryRuns]
      summary: Subscribe to story run SSE
      description: |
        返回 text/event-stream。事件名可能包括：
        - generation_step
        - plot_variable
        - story_event_planned
        - same_location_candidates
        - interaction_analysis
        - interaction_selected
        - negotiation_turn
        - character_turn
        - draft_delta
        - review_required
        其中 story run result、memory patch 和 review report 都是候选数据；只有 commit 成功后才会写入正式章节、记忆、关系和世界状态。
      operationId: subscribeStoryRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /story-runs/{run_id}/event-history:
    get:
      tags: [StoryRuns]
      summary: List persisted story run events
      description: 持久化 RunEvent 历史用于回看和审计；SSE 仍是实时运行态事件，chapter/memory 只由 commit 写入正史。
      operationId: listStoryRunEventHistory
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventListResponse"

  /story-runs/{run_id}/commit:
    post:
      tags: [StoryRuns]
      summary: Commit story run into canon
      operationId: commitStoryRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitStoryRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitStoryRunResponse"

  /projects/{project_id}/story-ticks/advance:
    post:
      tags: [StoryTicks]
      summary: Advance Simulation Timeline tick
      description: |
        Backward-compatible story path for advancing the project Simulation Timeline. Prefer /projects/{project_id}/simulation-ticks/advance in new clients.
        每次 tick 会：
        - 读取或初始化 Simulation Timeline、地点、角色模拟状态
        - 先结算到期 ongoing action
        - 对未完成行动的角色记录 skip event
        - 对空闲角色调用行动裁决器决定下一步行动与持续时间
        - 保存 simulation events 与 tick 后 snapshot
      operationId: advanceStoryTick
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStoryTickRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceStoryTickResponse"

  /projects/{project_id}/simulation-ticks/advance:
    post:
      tags: [SimulationTimeline]
      summary: Advance Simulation Timeline tick
      description: |
        推进项目世界模拟时间线。每次 tick 会：
        - 读取或初始化 Simulation Timeline、地点、角色模拟状态
        - 先结算到期 ongoing action
        - 对未完成行动的角色记录 skip event
        - 对空闲角色调用行动裁决器决定下一步行动与持续时间
        - 保存 simulation events 与 tick 后 snapshot
      operationId: advanceSimulationTick
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStoryTickRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceStoryTickResponse"

  /projects/{project_id}/story-state:
    get:
      tags: [StoryTicks]
      summary: Get current Simulation Timeline state
      description: Backward-compatible story path for current simulation state. Prefer /projects/{project_id}/simulation-state in new clients.
      operationId: getStorySimulationState
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySimulationStateResponse"

  /projects/{project_id}/simulation-state:
    get:
