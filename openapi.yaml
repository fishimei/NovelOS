      summary: List Narrative Timeline branches and ticks
      operationId: listNarrativeTimeline
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySessionTimelineResponse"

  /story-branches/{branch_id}/advance:
    post:
      tags: [StoryTimeline]
      summary: Advance Narrative Timeline from a story branch head
      description: Backward-compatible story path for branchable Narrative Timeline advance. Prefer /narrative-branches/{branch_id}/advance in new clients.
      operationId: advanceStoryBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStorySessionRequest"
      responses:
