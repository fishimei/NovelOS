                $ref: "#/components/schemas/StorySessionListResponse"

  /story-sessions/{session_id}:
    get:
      tags: [StorySessions]
      summary: Get story session
      operationId: getStorySession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySessionResponse"

  /story-sessions/{session_id}/advance:
    post:
      tags: [StorySessions]
      summary: Advance story session
      description: |
        用户输入一句推进语，系统会自动：
        - 读取正式设定状态
        - 识别当前冲突轴
        - 生成具备选择压力的剧情变量
        - 驱动角色互动并产出正文草稿
      operationId: advanceStorySession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStorySessionRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /story-sessions/{session_id}/timeline:
    get:
      tags: [StoryTimeline]
      summary: List story session Narrative Timeline branches and ticks
      description: Backward-compatible story path for the branchable Narrative Timeline. Prefer /story-sessions/{session_id}/narrative-timeline in new clients.
      operationId: listStorySessionTimeline
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySessionTimelineResponse"

