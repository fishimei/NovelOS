openapi: 3.0.3

info:
  title: NovelOS API
  version: 0.3.0
  description: |
    NovelOS 是一个“助手建模 + 世界模拟 + 可分叉故事推进”的小说创作后端。

    它分成三层：
    - 设定采集层：用户先说一句模糊想法，助手拆解成作者圣经、角色、关系、世界变量，并在必要时追问。
    - 世界模拟层：simulation tick 独立推进 Simulation Timeline，让角色基于当前位置和地点势力影响产生行动、事件与状态快照。
    - 故事推进层：story run 生成候选正文、交互记录和状态 patch，并可在任意 Narrative Timeline tick 上浏览、分叉、继续推进。

    当前规范描述后端资源边界与流程语义。

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Projects
  - name: AuthorBible
  - name: Characters
  - name: Relationships
  - name: SetupSessions
  - name: SetupRuns
  - name: DialogueSessions
  - name: DialogueRuns
  - name: DialogueActions
  - name: StorySessions
  - name: StoryRuns
  - name: StoryTimeline
    description: Backward-compatible tag for Narrative Timeline endpoints.
  - name: NarrativeTimeline
    description: Branchable narrative timeline for story runs, ticks, and state refs.
  - name: StoryTicks
    description: Backward-compatible tag for Simulation Timeline endpoints.
  - name: SimulationTimeline
    description: Project-level world simulation timeline, tick runs, events, and snapshots.
  - name: Chapters
  - name: Memories

