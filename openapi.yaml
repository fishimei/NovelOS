openapi: 3.0.3

info:
  title: NovelOS API
  version: 0.3.0
  description: |
    NovelOS 是一个“助手建模 + 事件驱动故事账本 + 可分叉故事推进”的小说创作后端。

    它分成三层：
    - 设定采集层：用户先说一句模糊想法，助手拆解成作者圣经、角色、关系、世界变量，并在必要时追问。
    - 故事推进层：story run 写入可回放的 StoryEvent 账本，支持分支、事件状态解析、事件分叉和事件段裁章。

    当前规范描述后端资源边界与流程语义。

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Projects
  - name: AuthorBible
  - name: Characters
  - name: Relationships
  - name: SetupSessions
  - name: SetupRuns
  - name: DialogueSessions
  - name: DialogueRuns
  - name: DialogueActions
  - name: StorySessions
  - name: StoryRuns
  - name: StoryEvents
    description: Event-log endpoints for branches, events, resolved state, forks, and chapter cuts.
  - name: World
  - name: Chapters
  - name: Memories

paths:
  /projects:
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}:
    get:
      tags: [Projects]
      summary: Get project detail
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    put:
      tags: [Projects]
      summary: Update project
      operationId: updateProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}/author-bible:
    get:
      tags: [AuthorBible]
      summary: Get author bible
      operationId: getAuthorBible
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    put:
      tags: [AuthorBible]
      summary: Update author bible
      operationId: updateAuthorBible
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthorBibleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}/characters:
    post:
      tags: [Characters]
      summary: Create character
      operationId: createCharacter
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    get:
      tags: [Characters]
      summary: List characters
      operationId: listCharacters
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"

  /characters/{character_id}:
    get:
      tags: [Characters]
      summary: Get character
      operationId: getCharacter
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    put:
      tags: [Characters]
      summary: Update character
      operationId: updateCharacter
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}/relationships:
    post:
      tags: [Relationships]
      summary: Create relationship
      operationId: createRelationship
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    get:
      tags: [Relationships]
      summary: List relationships
      operationId: listRelationships
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"

  /relationships/{relationship_id}:
    get:
      tags: [Relationships]
      summary: Get relationship
      operationId: getRelationship
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    put:
      tags: [Relationships]
      summary: Update relationship
      operationId: updateRelationship
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRelationshipRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}/setup-sessions:
    post:
      tags: [SetupSessions]
      summary: Create setup session
      description: 从一句模糊想法开始，启动助手建模会话。
      operationId: createSetupSession
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupSessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    get:
      tags: [SetupSessions]
      summary: List setup sessions
      operationId: listSetupSessions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"

  /setup-sessions/{session_id}:
    get:
      tags: [SetupSessions]
      summary: Get setup session
      operationId: getSetupSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /setup-sessions/{session_id}/advance:
    post:
      tags: [SetupSessions]
      summary: Advance setup session
      description: |
        用户追加一句说明，助手继续拆解、补全、追问，并输出可审校结构稿。
      operationId: advanceSetupSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceSetupSessionRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /setup-runs/{run_id}:
    get:
      tags: [SetupRuns]
      summary: Get setup run
      operationId: getSetupRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /setup-runs/{run_id}/result:
    get:
      tags: [SetupRuns]
      summary: Get setup run result
      description: 返回主控 agent 调工具起草的可视化草案、作者圣经、角色、关系、世界变量草稿，以及待追问问题。
      operationId: getSetupRunResult
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /setup-runs/{run_id}/event-history:
    get:
      tags: [SetupRuns]
      summary: List persisted setup run events
      description: 持久化 RunEvent 历史是运行态审计数据；正式设定仍只能通过 apply 写入。
      operationId: listSetupRunEventHistory
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventListResponse"

  /setup-sessions/{session_id}/apply:
    post:
      tags: [SetupSessions]
      summary: Apply setup run
      description: 将用户审校通过的设定草稿写入项目正式状态。
      operationId: applySetupRun
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplySetupRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}/dialogue-sessions:
    post:
      tags: [DialogueSessions]
      summary: Create dialogue session
      operationId: createDialogueSession
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDialogueSessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
    get:
      tags: [DialogueSessions]
      summary: List dialogue sessions
      operationId: listDialogueSessions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"

  /dialogue-sessions/{session_id}:
    get:
      tags: [DialogueSessions]
      summary: Get dialogue session
      operationId: getDialogueSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-sessions/{session_id}/advance:
    post:
      tags: [DialogueSessions]
      summary: Advance dialogue session
      description: 用户发送一条自然语言消息，由统一对话 Agent 调用工具读取上下文并提出可确认选项。
      operationId: advanceDialogueSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceDialogueSessionRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-runs/{run_id}:
    get:
      tags: [DialogueRuns]
      summary: Get dialogue run
      operationId: getDialogueRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-runs/{run_id}/result:
    get:
      tags: [DialogueRuns]
      summary: Get dialogue run result
      operationId: getDialogueRunResult
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-runs/{run_id}/events:
    get:
      tags: [DialogueRuns]
      summary: Subscribe dialogue run events
      operationId: subscribeDialogueRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE stream

  /dialogue-runs/{run_id}/event-history:
    get:
      tags: [DialogueRuns]
      summary: List dialogue run event history
      operationId: listDialogueRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-action-options/{option_id}/confirm:
    post:
      tags: [DialogueActions]
      summary: Confirm and execute dialogue action option
      operationId: confirmDialogueActionOption
      parameters:
        - name: option_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmDialogueActionOptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-action-options/{option_id}/auto-execute:
    post:
      tags: [DialogueActions]
      summary: Execute an auto-approved dialogue action option under policy
      operationId: autoExecuteDialogueActionOption
      parameters:
        - name: option_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoExecuteDialogueActionOptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /dialogue-action-options/{option_id}/reject:
    post:
      tags: [DialogueActions]
      summary: Reject dialogue action option
      operationId: rejectDialogueActionOption
      parameters:
        - name: option_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDialogueActionOptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /projects/{project_id}/story-sessions:
    post:
      tags: [StorySessions]
      summary: Create story session
      operationId: createStorySession
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorySessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySessionResponse"
    get:
      tags: [StorySessions]
      summary: List story sessions
      operationId: listStorySessions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySessionListResponse"

  /story-sessions/{session_id}:
    get:
      tags: [StorySessions]
      summary: Get story session
      operationId: getStorySession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorySessionResponse"

  /story-sessions/{session_id}/advance:
    post:
      tags: [StorySessions]
      summary: Advance story session
      description: |
        用户输入一句推进语，系统会自动：
        - 读取正式设定状态
        - 识别当前冲突轴
        - 生成具备选择压力的剧情变量
        - 驱动角色互动并产出正文草稿
      operationId: advanceStorySession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStorySessionRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /story-sessions/{session_id}/events:
    get:
      tags: [StoryEvents]
      summary: List story session event log
      description: Returns branches and events for a story session. This is the canonical story history surface.
      operationId: listStorySessionEvents
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryEventLogResponse"

  /story-branches/{branch_id}/advance:
    post:
      tags: [StoryEvents]
      summary: Advance a story branch from its head event
      operationId: advanceStoryBranch
      parameters:
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStorySessionRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /story-events/{event_id}:
    get:
      tags: [StoryEvents]
      summary: Get story event
      operationId: getStoryEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryEventResponse"

  /story-events/{event_id}/state:
    get:
      tags: [StoryEvents]
      summary: Resolve story state at an event
      description: Replays the branch event chain and returns the resolved world snapshot at the requested event.
      operationId: getStoryEventState
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryEventStateResponse"

  /story-events/{event_id}/fork:
    post:
      tags: [StoryEvents]
      summary: Fork a story branch from an event
      operationId: forkStoryEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkStoryEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryBranchResponse"

  /projects/{project_id}/world-map:
    get:
      tags: [World]
      summary: Get project world map
      operationId: getProjectWorldMap
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldMapResponse"

  /projects/{project_id}/world-map/tiles:
    get:
      tags: [World]
      summary: List project map tiles
      operationId: listProjectMapTiles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapTileListResponse"

  /projects/{project_id}/locations:
    get:
      tags: [World]
      summary: List project locations
      operationId: listProjectLocations
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationStateListResponse"

  /projects/{project_id}/faction-influences:
    get:
      tags: [World]
      summary: List project faction influences
      operationId: listProjectFactionInfluences
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactionInfluenceListResponse"

  /story-branches/{branch_id}/in-flight-actions:
    get:
      tags: [World]
      summary: List in-flight actions at story time
      description: Requires explicit story time. This endpoint never falls back to wall-clock time.
      operationId: listStoryBranchInFlightActions
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/StoryTimeAt"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OngoingActionListResponse"

  /story-runs/{run_id}:
    get:
      tags: [StoryRuns]
      summary: Get story run
      operationId: getStoryRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResponse"

  /story-runs/{run_id}/result:
    get:
      tags: [StoryRuns]
      summary: Get story run result
      operationId: getStoryRunResult
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRunResultResponse"

  /story-runs/{run_id}/events:
    get:
      tags: [StoryRuns]
      summary: Subscribe to story run SSE
      description: |
        Returns text/event-stream. Event names include generation_step, story_orchestration_started,
        plot_variable, story_event_planned, same_location_candidates, interaction_analysis,
        interaction_selected, negotiation_turn, character_turn, and draft_delta.
        SSE is live progress only; canon is reconstructed from StoryEvent records.
      operationId: subscribeStoryRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /story-runs/{run_id}/event-history:
    get:
      tags: [StoryRuns]
      summary: List persisted story run audit events
      description: Runtime audit history for a story run. Consumers must not reconstruct canon from these payloads.
      operationId: listStoryRunEventHistory
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventListResponse"

  /story-runs/{run_id}/cut-chapter:
    post:
      tags: [StoryRuns]
      summary: Cut a chapter from a story event span
      description: Creates a chapter and ChapterEventSpan from a branch event range. It may flush character memories to external retrieval, but it does not apply world, relationship, or memory state through a draft application step.
      operationId: cutStoryChapter
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CutChapterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CutChapterResponse"
  /projects/{project_id}/chapters:
    get:
      tags: [Chapters]
      summary: List published chapters
      operationId: listChapters
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterListResponse"

  /chapters/{chapter_id}:
    get:
      tags: [Chapters]
      summary: Get published chapter
      operationId: getChapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterResponse"

  /characters/{character_id}/memories:
    get:
      tags: [Memories]
      summary: List character memories
      operationId: listCharacterMemories
      parameters:
        - $ref: "#/components/parameters/CharacterId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponse"
    post:
      tags: [Memories]
      summary: Create character memory
      operationId: createCharacterMemory
      parameters:
        - $ref: "#/components/parameters/CharacterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResponse"

