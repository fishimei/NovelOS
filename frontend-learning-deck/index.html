<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>学习前端的心得体会 · HTML Deck</title>
<script>
window.DECK_MANIFEST = [
  { file: "slides/01-cover.html", label: "学习前端的心得体会" },
  { file: "slides/02-thesis.html", label: "前端不是三件套" },
  { file: "slides/03-browser.html", label: "先理解浏览器流水线" },
  { file: "slides/04-html.html", label: "HTML 先把意义放对" },
  { file: "slides/05-css.html", label: "CSS 是约束语言" },
  { file: "slides/06-js.html", label: "JS 管理时间里的状态" },
  { file: "slides/07-frameworks.html", label: "框架不是护身符" },
  { file: "slides/08-debugging.html", label: "调试决定学习速度" },
  { file: "slides/09-engineering.html", label: "工程化把正确变成默认" },
  { file: "slides/10-experience.html", label: "用户不会看到技术栈" },
  { file: "slides/11-learning-path.html", label: "学习方法" },
  { file: "slides/12-close.html", label: "结论" }
];
window.DECK_WIDTH = 1280;
window.DECK_HEIGHT = 720;
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #111;
  overflow: hidden;
  font-family: -apple-system, "Microsoft YaHei UI", "PingFang SC", sans-serif;
}
#stage {
  position: fixed;
  top: 0;
  left: 0;
  width: 1280px;
  height: 720px;
  transform-origin: top left;
  background: #F7EFE1;
  box-shadow: 0 10px 60px rgba(0,0,0,0.42);
}
iframe { width: 100%; height: 100%; border: 0; display: block; background: #F7EFE1; }
.counter {
  position: fixed;
  right: 18px;
  bottom: 16px;
  min-width: 78px;
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(0,0,0,0.68);
  color: #fff;
  font-size: 12px;
  text-align: center;
  user-select: none;
}
.nav {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 18%;
  cursor: pointer;
}
.nav.left { left: 0; }
.nav.right { right: 0; }
</style>
</head>
<body>
<div id="stage"><iframe id="frame" src="about:blank"></iframe></div>
<div class="nav left" id="prev"></div>
<div class="nav right" id="next"></div>
<div class="counter" id="counter">1 / 1</div>
<script>
(function () {
  const deck = window.DECK_MANIFEST;
  const W = window.DECK_WIDTH;
  const H = window.DECK_HEIGHT;
  const stage = document.getElementById("stage");
  const frame = document.getElementById("frame");
  const counter = document.getElementById("counter");
  let current = 0;
  function fit() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth - W * scale) / 2;
    const y = (window.innerHeight - H * scale) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }
  function show(i) {
    if (i < 0 || i >= deck.length) return;
    current = i;
    frame.src = deck[i].file;
    counter.textContent = `${i + 1} / ${deck.length}`;
    history.replaceState(null, "", "#" + (i + 1));
  }
  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }
  document.addEventListener("keydown", (event) => {
    if (["ArrowRight", " ", "PageDown"].includes(event.key)) { event.preventDefault(); next(); }
    if (["ArrowLeft", "PageUp"].includes(event.key)) { event.preventDefault(); prev(); }
    if (event.key === "Home") { event.preventDefault(); show(0); }
    if (event.key === "End") { event.preventDefault(); show(deck.length - 1); }
  });
  document.getElementById("next").addEventListener("click", next);
  document.getElementById("prev").addEventListener("click", prev);
  window.addEventListener("resize", fit);
  const hash = location.hash.match(/^#(\d+)$/);
  fit();
  show(hash ? Math.min(parseInt(hash[1], 10) - 1, deck.length - 1) : 0);
}());
</script>
</body>
</html>
