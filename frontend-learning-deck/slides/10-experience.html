<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>用户不会看到技术栈</title>
<style>

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 960pt;
  height: 540pt;
  overflow: hidden;
}
body {
  position: relative;
  background: #F7EFE1;
  color: #2B2118;
  font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
}
h1, h2, h3, h4, p, ul, li {
  margin: 0;
  padding: 0;
  letter-spacing: 0;
}
.slide {
  position: relative;
  width: 960pt;
  height: 540pt;
  overflow: hidden;
}
.paper { background: #F7EFE1; }
.ink { background: #2B2118; color: #FFF8EB; }
.coal { background: #3A2A1E; color: #FFF8EB; }
.frame {
  position: absolute;
  left: 32pt;
  top: 28pt;
  width: 896pt;
  height: 484pt;
  border: 1.2pt solid #2B2118;
}
.ink .frame, .coal .frame { border-color: #FFF8EB; }
.rule { position: absolute; height: 1.1pt; background: #2B2118; }
.ink .rule, .coal .rule { background: #FFF8EB; }
.v-rule { position: absolute; width: 1.1pt; background: #2B2118; }
.ink .v-rule, .coal .v-rule { background: #FFF8EB; }
.kicker {
  position: absolute;
  left: 54pt;
  top: 42pt;
  width: 180pt;
  height: 18pt;
}
.kicker p {
  font-size: 8.5pt;
  line-height: 12pt;
  font-weight: 700;
  color: #B8752A;
  text-transform: uppercase;
}
.ink .kicker p, .coal .kicker p { color: #D7A83E; }
.slide-no {
  position: absolute;
  right: 54pt;
  top: 42pt;
  width: 80pt;
  height: 16pt;
}
.slide-no p {
  font-size: 8.5pt;
  line-height: 12pt;
  text-align: right;
  color: #806F5D;
}
.ink .slide-no p, .coal .slide-no p { color: #8B7A67; }
.footer {
  position: absolute;
  left: 54pt;
  bottom: 30pt;
  width: 852pt;
  height: 14pt;
}
.footer p {
  font-size: 7.5pt;
  line-height: 10pt;
  color: #806F5D;
}
.ink .footer p, .coal .footer p { color: #8B7A67; }
.title h1 {
  font-size: 42pt;
  line-height: 48pt;
  font-weight: 800;
}
.title h2 {
  font-size: 29pt;
  line-height: 36pt;
  font-weight: 800;
}
.lead p {
  font-size: 15pt;
  line-height: 22pt;
  font-weight: 700;
}
.body p, .body li {
  font-size: 12.5pt;
  line-height: 18pt;
}
.small p, .small li {
  font-size: 9.5pt;
  line-height: 14pt;
}
.caption p {
  font-size: 8.5pt;
  line-height: 12pt;
  color: #806F5D;
}
.ink .caption p, .coal .caption p { color: #8B7A67; }
.accent-blue { color: #B8752A; }
.accent-red { color: #C65A3A; }
.accent-green { color: #8bc400; }
.accent-cyan { color: #7A8A4B; }
.accent-lime { color: #D7A83E; }
.box {
  position: absolute;
  background: #FFF8EB;
  border: 1.1pt solid #2B2118;
}
.dark-box {
  position: absolute;
  background: #3A2A1E;
  border: 1.1pt solid #FFF8EB;
}
.tag {
  position: absolute;
  background: #2B2118;
  border-radius: 9pt;
}
.tag p {
  font-size: 8.2pt;
  line-height: 13pt;
  font-weight: 700;
  text-align: center;
  color: #FFF8EB;
}
.chip {
  position: absolute;
  border-radius: 11pt;
  background: #F7EFE1;
  border: 1pt solid #2B2118;
}
.chip p {
  font-size: 8.8pt;
  line-height: 14pt;
  font-weight: 700;
  text-align: center;
  color: #2B2118;
}
.big-num p {
  font-family: Arial Black, Impact, "Microsoft YaHei UI", sans-serif;
  font-size: 116pt;
  line-height: 112pt;
  font-weight: 900;
}
.mono p {
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 10pt;
  line-height: 15pt;
}
ul {
  list-style: disc;
  padding-left: 18pt;
}
li { padding-left: 2pt; }

</style>
</head>
<body>

<div class="slide paper">
  <div class="frame"></div>
  <div class="kicker"><p>Experience</p></div>
  <div class="slide-no"><p>10 / 12</p></div>
  <div class="footer"><p>学习前端的心得体会 · HTML source deck · NovelOS</p></div>

  <div class="title" style="position:absolute; left:58pt; top:82pt; width:690pt; height:86pt;">
    <h2>用户不会看到你的技术栈，<br>只会感到<span class="accent-lime">快、清楚、可靠</span>。</h2>
  </div>
  <div class="lead" style="position:absolute; left:62pt; top:190pt; width:560pt; height:54pt;">
    <p>性能和可访问性不是锦上添花。它们是前端体验的结算单。</p>
  </div>
  <div class="dark-box" style="left:92pt; top:292pt; width:230pt; height:118pt; background:#3A2A1E; border-color:#D7A83E;"></div>
  <div class="dark-box" style="left:366pt; top:292pt; width:230pt; height:118pt; background:#3A2A1E; border-color:#B8752A;"></div>
  <div class="dark-box" style="left:640pt; top:292pt; width:230pt; height:118pt; background:#3A2A1E; border-color:#C65A3A;"></div>
  <div class="body" style="position:absolute; left:118pt; top:316pt; width:174pt; height:50pt;"><p style="color:#D7A83E; font-weight:800;">性能<br><span style="color:#FFF8EB;">少等、少卡、少猜</span></p></div>
  <div class="body" style="position:absolute; left:392pt; top:316pt; width:174pt; height:50pt;"><p style="color:#B8752A; font-weight:800;">可访问性<br><span style="color:#FFF8EB;">键盘可达、语义可读</span></p></div>
  <div class="body" style="position:absolute; left:666pt; top:316pt; width:174pt; height:50pt;"><p style="color:#C65A3A; font-weight:800;">失败体验<br><span style="color:#FFF8EB;">错误可懂、重试可见</span></p></div>
  <div class="caption" style="position:absolute; left:94pt; top:442pt; width:760pt; height:28pt;">
    <p>我的判断：真正专业的前端，先处理边界情况，再谈动效和漂亮。</p>
  </div>
</div>
</body>
</html>
