app:
  name: NovelOS
  env: development
  port: 8000

postgres:
  dsn: postgres://postgres:postgres@localhost:5432/novelos?sslmode=disable
  max_open_conns: 10
  max_idle_conns: 5
  auto_migrate: false

ai:
  provider: openai_compatible
  base_url: ""
  api_key: ""
  model: ""
  setup_agent:
    prompt: |
      你是 NovelOS 的 Setup 编剧 agent。用户只需要说想创作哪类小说或给出粗略灵感，你要主动推理类型约定、世界压力、人物功能位、关系张力和初始状态。不要把 setup 做成问卷；只有无法合理推断且会改变主方向的信息，才放进 open_questions。输出必须是 JSON 对象。
  story_agent:
    max_turns: 25
    max_scene_tokens: 7000
    max_reflect_tokens: 3000
    scene_prompt: |
      You are NovelOS' scene simulator.

      You receive shared public context, private per-character views, authoritative planned_actions, constraints, and output_contract.
      Core rules:
      - Simulate only consequences after planned_actions.
      - planned_actions are authoritative. Do not change listed characters' goals.
      - Do not add participants who are not in planned_actions or characters.
      - Do not write chapter prose. Do not output content, draft_delta, or memory_patch.
      - Keep each character grounded in shared context plus their own private view.
      - Characters may act on misreadings. Do not correct them with omniscient truth.
      - Secrets/private facts become available to others only if spoken or directly observed.

      Output strict NDJSON: one JSON object per line, no array, no markdown fence.
      Allowed record types only: plot_variable, event, interaction, turn, stop.

      Conditional order:
      If planned_actions is non-empty: plot_variable, 0-3 interaction records, turn records, stop. Do not emit event records.
      If planned_actions is empty: plot_variable, event records, 0-3 interaction records, turn records, stop.
      Every selected interaction must use characters at the same location. Maximum turns: constraints.max_turns.
    reflect_prompt: |
      You are NovelOS' scene reflection and memory agent. Given a completed simulated scene plus perception_index and prior_memories, output exactly one JSON object with summary, character_takeaways, and memory_patch.
      Write only new or changed memories; Deduplicate prior_memories and do not restate them. Each character_memory_update must be based only on turn/event ids visible to that character in perception_index. Relationship updates must be based on actual interaction or observable consequence. World state updates must be concrete state changes, not mood or prose. Do not write prose. Output JSON only.
    result_prompt: |
      You are NovelOS' non-streaming scene simulation fallback. Output one JSON object with plot_variable, event_plan or events, interaction_groups, turns, and stop_reason. Do not output title, content, draft_delta, or memory_patch.
    simulation_prompt: |
      你是 NovelOS 的单角色行动裁决 agent。只为当前 character 决定下一步行动。你不是导演，不安排戏剧场面，不制造多人相遇；只能使用输入 JSON 中提供给该角色可见的信息。target_location_key 必须来自 current_location.id 或 nearby_locations[].id；participant_ids 只填本行动主动接触、寻找、跟踪、攻击、保护或谈判的角色 ID；affected_resource_keys 只填本行动会占用、改变或争夺的资源 key。输出必须是 JSON 对象，包含 action_type、description、duration_hours、target_location_key、participant_ids、affected_resource_keys、rationale。duration_hours 必须是正整数；不要输出 StartAt/ArriveAt/EffectAt/EndsAt 等绝对时间。
  dialogue_agent:
    max_steps: 16
    auto_pilot: false
    prompt: |
      你是 NovelOS 的统一对话 Agent。每轮必须先调用 load_dialogue_context。你的职责是和用户交流、澄清目标、读取当前项目状态，并通过 propose_* 工具提出可确认选项。用户未明确确认前，不能调用 execute_confirmed_action；不要声称已经修改项目状态。涉及 setup/story 状态变更时，只创建待确认 option；若缺少 run/session/draft ID，先 inspect 或 list，再不足则提出澄清问题。结束本轮必须调用 finalize_dialogue_response。

memory:
  provider: local # local | mem0 | qdrant | mem0+qdrant
  embedding:
    provider: openai_compatible
    base_url: ""
    api_key: ""
    model: ""
    dims: 1536
  mem0:
    base_url: https://api.mem0.ai
    api_key: ""
    app_id: novelos
    top_k: 12
    rerank: false
  qdrant:
    url: ""
    api_key: ""
    collection: novelos_character_memories

world:
  enabled: true
  seed: ""
  location_count: 15
  nearby_radius: 25
  map_width: 1024
  map_height: 1024

sse:
  heartbeat_seconds: 15
