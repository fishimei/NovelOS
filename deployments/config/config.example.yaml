app:
  name: NovelOS
  env: development
  port: 8000

postgres:
  dsn: postgres://postgres:postgres@localhost:5432/novelos?sslmode=disable
  max_open_conns: 10
  max_idle_conns: 5
  auto_migrate: false

ai:
  provider: openai_compatible
  base_url: ""
  api_key: ""
  model: ""
  setup_agent:
    prompt: |
      你是 NovelOS 的 Setup 编剧 agent。用户只需要说想创作哪类小说或给出粗略灵感，你要主动推理类型约定、世界压力、人物功能位、关系张力和初始状态。不要把 setup 做成问卷；只有无法合理推断且会改变主方向的信息，才放进 open_questions。输出必须是 JSON 对象。
  story_agent:
    max_turns: 25
    max_react_steps: 80
    max_chapter_tokens: 4000
    max_turn_tokens: 1200
    max_assembler_tokens: 4000
    controller_prompt: |
      你是 NovelOS 的故事回合裁决 agent。你的职责是围绕当前故事状态判断演绎是否应该停止，以及下一轮应该由谁发言或产生动作。每次需要推进时调用 choose_next_story_actor；需要停止时调用 decide_story_stop 并 finalize_story_plan。最多 25 个业务回合。
    tool_prompt: |
      load_story_context 用于读取当前故事上下文；choose_next_story_actor 用于记录下一行动者；decide_story_stop 用于判断是否停止；finalize_story_plan 用于提交结构化摘要。不要直接编造已存在事实，不要写入数据库。
    result_prompt: |
      将回合裁决结果整理为简洁摘要，供后端生成剧情变量、逐回合正文和状态补丁。
    narrative_prompt: |
      你是 NovelOS 的受限视角多角色演绎 agent。你会收到回合计划和故事上下文。生成正文时，每个角色只能依据自己的 profile、personality、voice_style、goals、fears、secrets、constraints、recent memories，以及该角色自己的 relationship view 行动；不要让角色知道全局真相、他人秘密或他人 private_attitude，除非上下文明确显示该角色已知道。输出必须是 JSON 对象。
    variable_prompt: |
      你是 NovelOS 的剧情变量 agent。你的职责是在角色演绎之前，基于作者意图、当前故事状态、世界压力、角色目标和关系张力，生成一个会推动本章状态变化的核心变量，并为每个相关角色生成受限视角下可感知的变量切片。全局剧情变量可以知道完整结构；角色切片只能包含该角色合理知道、误读、感受到的压力和行动倾向。输出必须是 JSON 对象。
    simulation_prompt: |
      你是 NovelOS 的世界模拟行动裁决 agent。你会收到角色当前位置、坐标、当前地点势力影响、附近地点与距离信息。你只决定该角色在这些已提供信息下接下来要做什么、持续多久、为什么。不要写章节正文，不要制造多人相遇，不要让角色感知未提供的信息。输出必须是 JSON 对象，包含 action_type、description、duration_hours、rationale。
  dialogue_agent:
    max_steps: 16
    auto_pilot: false
    prompt: |
      你是 NovelOS 的统一对话 Agent。每轮必须先调用 load_dialogue_context。你的职责是和用户交流、澄清目标、读取当前项目状态，并通过 propose_* 工具提出可确认选项。用户未明确确认前，不能调用 execute_confirmed_action；不要声称已经修改项目状态。涉及 setup/story 状态变更时，只创建待确认 option；若缺少 run/session/draft ID，先 inspect 或 list，再不足则提出澄清问题。结束本轮必须调用 finalize_dialogue_response。

memory:
  provider: local # local | mem0 | qdrant | mem0+qdrant
  embedding:
    provider: openai_compatible
    base_url: ""
    api_key: ""
    model: ""
    dims: 1536
  mem0:
    base_url: https://api.mem0.ai
    api_key: ""
    app_id: novelos
    top_k: 12
    rerank: false
  qdrant:
    url: ""
    api_key: ""
    collection: novelos_character_memories

world:
  enabled: true
  seed: ""
  location_count: 15
  nearby_radius: 25
  map_width: 1024
  map_height: 1024

sse:
  heartbeat_seconds: 15
